<script id="course-data" type="application/json">{"units":[{"id":"9a","lesson":9,"title":"Можу, мушу, полюбляю","sub":"galiu · turiu · mėgstu + інфінітив","icon":"bolt","intro":"У конструкціях цього уроку перше дієслово змінюється за особами, а назва дії залишається в інфінітиві: galiu kalbėti, turime eiti, mėgsta žaisti.","heads":["Особа","Можу","Мушу","Полюбляю"],"rows":[["Aš","galiu","turiu","mėgstu"],["Tu","gali","turi","mėgsti"],["Jis / ji","gali","turi","mėgsta"],["Mes","galime","turime","mėgstame"],["Jūs","galite","turite","mėgstate"],["Jie / jos","gali","turi","mėgsta"]],"tips":["Ar tu gali padėti? — Чи можеш допомогти? Gali — особова форма; padėti — інфінітив.","Turėti має два значення: turiu brolį — маю брата; turiu eiti — мушу йти.","Те саме правило діє з norėti: aš noriu žaisti, mes norime žaisti.","Змінюємо лише перше дієслово: aš galiu eiti → mes galime eiti.","Заперечення пишемо разом: negaliu, nenoriu, neturiu, nemėgstu. Друге дієслово залишається інфінітивом."],"source":"PDF уроку 9, с. 2–3. Додаткові вправи на особові форми."},{"id":"9b","lesson":9,"title":"Добери потрібну дію","sub":"eiti · kalbėti · žaisti · atostogauti","icon":"chat","intro":"Поєднуй дієслово з доречною дією. Уважно читай ситуацію: хтось поспішає на роботу, хоче зайти в кав’ярню або полюбляє відпочивати біля моря.","heads":["Литовською","Українською"],"rows":[["Atsiprašau, turiu eiti.","Вибачте, мушу йти."],["Ar aš galiu kalbėti angliškai?","Чи можу я говорити англійською?"],["Vaikai nori žaisti kieme.","Діти хочуть гратися у дворі."],["Sūnus nori studijuoti.","Син хоче навчатися у виші."],["Autobuse vaikai mėgsta sėdėti prie lango.","В автобусі діти люблять сидіти біля вікна."]],"tips":["У потрібній конструкції ставимо інфінітив: nori žaisti, а не nori žaidžia.","Būti seminare — бути на семінарі; studijuoti universitete — навчатися в університеті.","Žiūrėti televizorių — дивитися телевізор; sėdėti prie lango — сидіти біля вікна.","У реченні про море можливі різні дії. Для «відпочивати у відпустці» використовуй atostogauti; для «їхати» — važiuoti.","У відкритій вправі з PDF про море приймаються atostogauti та važiuoti. Решта запитань мають уточнений зміст."],"source":"PDF уроку 9, с. 2–3."},{"id":"9c","lesson":9,"title":"Числа від нуля до десяти","sub":"nulis · vienas · du · dešimt","icon":"number","intro":"Повтори числа 0–10. Для читання окремих цифр використовуй форми зі списку: nulis, vienas, du… У наступних блоках навчишся узгоджувати числа з іменниками.","heads":["Число","Словом"],"rows":[["0","nulis"],["1","vienas"],["2","du"],["3","trys"],["4","keturi"],["5","penki"],["6","šeši"],["7","septyni"],["8","aštuoni"],["9","devyni"],["10","dešimt"]],"tips":["Телефонні цифри можна тренувати окремо: 2 · 0 · 4 — du, nulis, keturi.","Пиши šeši, aštuoni, dešimt із литовськими літерами. Під полем відповіді є кнопки з діакритиками.","У цьому блоці «1» без іменника — vienas. З жіночим іменником буде viena.","У PDF є завдання з адресами та телефонами, які частково потребують аудіозапису. Тут використовуємо видимий словник чисел і окремі навчальні послідовності цифр.","Основна тема кількості з іменниками в цьому уроці — числа 1–9."],"source":"PDF уроку 9, с. 4."},{"id":"9d","lesson":9,"title":"Один брат, одна сестра","sub":"vienas / viena · du / dvi","icon":"family","intro":"У називному відмінку числівник узгоджується з родом іменника. Порівняй: du broliai, але dvi seserys. Для трьох обидва роди мають однакову форму trys.","heads":["Число","Чоловічий рід","Жіночий рід"],"rows":[["1","vienas","viena"],["2","du","dvi"],["3","trys","trys"],["4","keturi","keturios"],["5","penki","penkios"],["6","šeši","šešios"],["7","septyni","septynios"],["8","aštuoni","aštuonios"],["9","devyni","devynios"]],"tips":["Vienas vyras — один чоловік. Viena moteris — одна жінка.","Du broliai — два брати. Dvi seserys — дві сестри.","Trys broliai / trys seserys: форма числівника однакова.","Keturi, penki, šeši… — чоловічий рід; keturios, penkios, šešios… — жіночий.","Після 1 — однина; після 2–9 у наведених називних конструкціях — множина."],"source":"PDF уроку 9, с. 5–6, 11–13."},{"id":"9e","lesson":9,"title":"Рід і число іменника","sub":"vienas · viena · keturi · keturios","icon":"layers","intro":"Вибирай числівник за литовським родом, навіть якщо українське слово має інший рід. Diena — жіночого роду; knygynas — чоловічого.","heads":["Однина","Множина","Рід"],"rows":[["brolis","broliai","чоловічий"],["sesuo","seserys","жіночий"],["sūnus","sūnūs","чоловічий"],["duktė","dukterys","жіночий"],["vaikas","vaikai","чоловічий"],["pusbrolis","pusbroliai","чоловічий"],["pusseserė","pusseserės","жіночий"],["senelis","seneliai","чоловічий"],["senelė","senelės","жіночий"],["teta","tetos","жіночий"],["dėdė","dėdės","чоловічий"],["draugas","draugai","чоловічий"],["draugė","draugės","жіночий"],["anūkas","anūkai","чоловічий"],["anūkė","anūkės","жіночий"],["močiutė","močiutės","жіночий"],["moteris","moterys","жіночий"],["vyras","vyrai","чоловічий"],["žmogus","žmonės","чоловічий"],["šeima","šeimos","жіночий"],["sekmadienis","sekmadieniai","чоловічий"],["knygynas","knygynai","чоловічий"],["bažnyčia","bažnyčios","жіночий"],["diena","dienos","жіночий"],["universitetas","universitetai","чоловічий"],["rytas","rytai","чоловічий"],["parduotuvė","parduotuvės","жіночий"],["katė","katės","жіночий"],["pilis","pilys","жіночий"],["mergina","merginos","жіночий"],["žmona","žmonos","жіночий"],["sekretorė","sekretorės","жіночий"],["miestas","miestai","чоловічий"]],"tips":["Vienas knygynas — одна книгарня. Viena diena — один день. Переклад не визначає литовського роду.","Dėdė — чоловічий рід попри -ė: vienas dėdė, keturi dėdės.","Moteris і pilis — жіночий рід: viena moteris, viena pilis.","Окремо вивчи sesuo → seserys; duktė → dukterys; žmogus → žmonės.","У вправі зі с. 13 розподіляємо слова у чотири групи: vienas, viena, keturi, keturios. Додаткові форми зведено до таблиці."],"source":"PDF уроку 9, с. 8–9, 13; додаткові словникові форми."},{"id":"9f","lesson":9,"title":"Після kiek — родовий","sub":"brolių · seserų · vaikų","icon":"tree","intro":"Коли питаємо про кількість людей або предметів, після kiek ставимо родовий відмінок множини: Kiek brolių? — Скільки братів?","heads":["Називний множини","Після kiek","Українською"],"rows":[["broliai","brolių","брат"],["seserys","seserų","сестра"],["sūnūs","sūnų","син"],["dukterys","dukterų","донька"],["vaikai","vaikų","дитина"],["pusbroliai","pusbrolių","двоюрідний брат"],["pusseserės","pusseserių","двоюрідна сестра"],["seneliai","senelių","дідусь"],["senelės","senelių","бабуся"],["tetos","tetų","тітка"],["dėdės","dėdžių","дядько"],["draugai","draugų","друг"],["draugės","draugių","подруга"],["anūkai","anūkų","онук"],["anūkės","anūkių","онука"],["močiutės","močiučių","бабуся"],["moterys","moterų","жінка"],["vyrai","vyrų","чоловік"],["žmonės","žmonių","людина"],["šeimos","šeimų","родина"],["sekmadieniai","sekmadienių","неділя"],["knygynai","knygynų","книгарня"],["bažnyčios","bažnyčių","церква"],["dienos","dienų","день"],["universitetai","universitetų","університет"],["rytai","rytų","ранок"],["parduotuvės","parduotuvių","магазин"],["katės","kačių","кішка"],["pilys","pilių","замок; фортеця"],["merginos","merginų","дівчина"],["žmonos","žmonų","дружина"],["sekretorės","sekretorių","секретарка"],["miestai","miestų","місто"]],"tips":["Broliai → brolių; draugai → draugų; tetos → tetų.","Seserys → seserų; dukterys → dukterų; vaikai → vaikų.","Pusseserės → pusseserių; draugės → draugių; seneliai → senelių.","Не підставляй називний у запитання: Kiek brolių turi?, а не Kiek broliai turi?","Це модель для рахованих іменників цього уроку. Інші значення кількості можуть мати інші форми.","Senelių може відповідати як seneliai, так і senelės. У вправі орієнтуйся на вказане початкове слово."],"source":"PDF уроку 9, с. 7–9; додаткове відпрацювання лексики зі с. 13."},{"id":"9g","lesson":9,"title":"Запитай «скільки?»","sub":"Kiek brolių turite?","icon":"chat","intro":"Збудуй запитання за моделлю kiek + родовий множини + дієслово. У відповідях нижче потрібен уже інший відмінок.","heads":["Запитання","Переклад"],"rows":[["Kiek vaikų jūs turite?","Скільки дітей ви маєте?"],["Kiek seserų turite?","Скільки сестер ви маєте?"],["Kiek brolių turi?","Скільки братів маєш?"],["Kiek miestų yra Lietuvoje?","Скільки міст є в Литві?"],["Kiek tavo pusbrolių gyvena Vilniuje?","Скільки твоїх двоюрідних братів живуть у Вільнюсі?"]],"tips":["Tu turi — ти маєш; jūs turite — ви маєте. Займенник можна опустити, якщо форма зрозуміла.","Запитання Kiek brolių turi? не починаємо з Ar: kiek уже означає «скільки».","Kiek brolių? — запитання з родовим. Turiu du brolius. — відповідь зі знахідним.","Запитання Kiek miestų yra Lietuvoje? тренує граматичну форму; кількість міст у цьому застосунку вгадувати не потрібно."],"source":"PDF уроку 9, с. 7–9."},{"id":"9h","lesson":9,"title":"Числівники у знахідному","sub":"vieną · du / dvi · tris","icon":"number","intro":"Після turėti у значенні «мати» ставимо знахідний відмінок: змінюється і числівник, і іменник. Turiu keturis brolius, але keturias seseris.","heads":["№","Чоловічий: кого?","Жіночий: кого?"],"rows":[["1","vieną","vieną"],["2","du","dvi"],["3","tris","tris"],["4","keturis","keturias"],["5","penkis","penkias"],["6","šešis","šešias"],["7","septynis","septynias"],["8","aštuonis","aštuonias"],["9","devynis","devynias"]],"tips":["Vienas / viena → vieną для обох родів: vieną brolį, vieną seserį.","Du та dvi у знахідному зберігають форму: du brolius, dvi seseris.","Trys → tris для обох родів. Це різні форми: y у називному, i у знахідному.","Чоловічі 4–9: keturis, penkis, šešis, septynis, aštuonis, devynis.","Жіночі 4–9: keturias, penkias, šešias, septynias, aštuonias, devynias."],"source":"PDF уроку 9, с. 10–12, 14–18."},{"id":"9i","lesson":9,"title":"Родичі: кого маю?","sub":"brolį / brolius · seserį / seseris","icon":"family","intro":"Одна людина потребує знахідного однини, кілька людей — знахідного множини. Не змішуй dukterų у запитанні з dukteris у відповіді.","heads":["Хто?","Маю одного / одну","Маю кількох"],"rows":[["brolis","brolį","brolius"],["sesuo","seserį","seseris"],["sūnus","sūnų","sūnus"],["duktė","dukterį","dukteris"],["vaikas","vaiką","vaikus"],["pusbrolis","pusbrolį","pusbrolius"],["pusseserė","pusseserę","pusseseres"],["senelis","senelį","senelius"],["senelė","senelę","seneles"],["teta","tetą","tetas"],["dėdė","dėdę","dėdes"],["draugas","draugą","draugus"],["draugė","draugę","drauges"],["anūkas","anūką","anūkus"],["anūkė","anūkę","anūkes"]],"tips":["Brolis → brolį → brolius. Sesuo → seserį → seseris.","Sūnus → sūnų → sūnus: Turiu vieną sūnų, але du sūnus.","Duktė → dukterį → dukteris. Запитання: Kiek dukterų? Відповідь: Turiu dvi dukteris.","Draugė → draugę → drauges. У множині знахідного пишемо e, а не ė.","Числівник і назва родича змінюються разом: keturi pusbroliai → keturis pusbrolius."],"source":"PDF уроку 9, с. 14–18."},{"id":"9j","lesson":9,"title":"Порахуй і розкажи","sub":"du sūnus · dvi dukteris","icon":"group","intro":"Закріпи всю конструкцію: хто має, скільки має і кого саме. Тут є перероблені на інтерактивні завдання приклади зі с. 14–18 PDF.","heads":["Приклад","Українською"],"rows":[["Aš turiu du sūnus.","Я маю двох синів."],["Joana turi dvi dukteris.","Йоана має двох доньок."],["Mes turime vieną tetą.","Ми маємо одну тітку."],["Jurga ir Juozas turi penkis pusbrolius.","Юрга і Юозас мають п’ятьох двоюрідних братів."],["Vaikai turi du senelius ir dvi seneles.","Діти мають двох дідусів і двох бабусь."]],"tips":["Mes turime, але Joana turi, jie turi, Jurga ir Juozas turi.","Після turi не залишаємо називний: Paulius turi du brolius, а не du broliai.","У парних назвах уважно змінюй рід: du pusbrolius ir dvi pusseseres.","Якщо є уточнення після двокрапки, кожна назва лишається у потрібному відмінку: keturis vaikus: du sūnus ir dvi dukteris.","Для власної практики відкрий «Майстерню кількості»: вона зіставляє запитання, називний і знахідний для 1–9."],"source":"PDF уроку 9, с. 14–18."},{"id":"9k","lesson":9,"title":"Сім’я Лінаса й Крістіни","sub":"Milda · Mantas · du seneliai","icon":"book","intro":"Прочитай заповнений текст зі с. 19. Перевір, хто оповідач, як звати дітей і куди вони ходять. Після читання заповни пропуски та дай відповіді.","heads":["Хто?","Що каже текст"],"rows":[["Linas","оповідач; чоловік Крістіни"],["Kristina","дружина Лінаса"],["Milda","донька; ще мала; ходить до дитсадка"],["Mantas","син; ходить до школи"],["Seneliai","живуть неподалік; часто зустрічаються з родиною"]],"tips":["Mano žmonos vardas yra Kristina — мою дружину звати Крістіна.","Milda eina į vaikų darželį — Мілда ходить до дитячого садка.","Mantas eina į mokyklą — Мантас ходить до школи.","Vaikai turi du senelius ir dvi seneles — у дітей є двоє дідусів і двоє бабусь.","Конкретного віку дітей і міста проживання текст не називає. У запитаннях не потрібно цього вигадувати."],"source":"PDF уроку 9, с. 19."},{"id":"9l","lesson":9,"title":"Родина тітки Ліни","sub":"H → D → A → F → B → C → E → J → G","icon":"route","intro":"Віднови порядок дев’яти речень зі с. 20. Далі прочитай отриману розповідь із перекладом. Оповідач хоче їхати разом; текст не стверджує, що він уже поїхав.","heads":["Опорне слово","Значення"],"rows":[["mamytės sesuo","сестра матусі"],["dėdė Valdas","дядько Валдас"],["pusseserė ir pusbrolis","двоюрідні сестра і брат"],["šuns vardas","кличка собаки"],["prie ežero","до озера / біля озера"],["kartu","разом"]],"tips":["Початок H представляє тітку Ліну. D додає її чоловіка; A називає дітей.","F вводить собаку, B називає її кличку, C пояснює, хто її любить.","E «Aš taip pat» означає, що оповідач теж любить Бону.","J розповідає про сьогоднішню поїздку, G — про бажання оповідача приєднатися.","У тренажері торкайся речень у потрібному порядку. Обрані літери з’являтимуться зверху; їх можна повертати."],"source":"PDF уроку 9, с. 20."}],"cards":[{"id":"c9_1","units":["9a"],"lt":"Aš galiu eiti","uk":"можу йти","note":"galėti + інфінітив eiti; особова форма galiu."},{"i function norm(v,lax=false){let s=String(v).normalize('NFC').toLocaleLowerCase('lt-LT').replace(/[.,!?;:„“”"'’()—–-]/g,' ').replace(/\s+/g,' ').trim();if(lax)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');return s;}
function answerMatches(q,v,strict=true){return q.answers.some(a=>norm(a,!strict)===norm(v,!strict));}
function balanced(pool,n){const groups=D.units.map(u=>shuffle(pool.filter(q=>q.unit===u.id))).filter(a=>a.length),result=[];while(result.length<n&&groups.some(a=>a.length)){for(const g of shuffle(groups)){if(g.length&&result.length<n)result.push(g.pop());}}return shuffle(result);}
function prepare(q){const x={...q,retry:false};if(q.kind==='choice'){const wrong=q.options.filter(v=>!q.answers.some(a=>norm(a)===norm(v)));x.choices=shuffle([q.answers[0],...take(wrong,3)]);}if(q.kind==='build'){x.tokens=shuffle(q.answers[0].split(/\s+/).map((t,i)=>({t,i})));x.selected=[];}return x;}
function startQuiz(pool,{title='Тренування',n=12,test=false,unit=null,exact=false}={}){if(!pool.length){toast('Для цього режиму поки немає завдань.');return;}const initial=exact?pool:balanced(pool,n);quiz={queue:initial.map(prepare),at:0,total:initial.length,correct:0,xp:0,first:0,test,unit,title,checked:false,value:'',result:null,choicesMissed:[],strict:S.settings.strict,origin:view};view='quiz';stopSpeech();render();}
function scoreCard(id,success,now=Date.now()){
 if(!C[id])return;const old=S.cards[id]||{level:0,due:0,lastDay:'',last:0};
 if(!success){S.cards[id]={level:0,due:now+600000,lastDay:dateKey(new Date(now)),last:now};return;}
 if(old.level>0&&old.lastDay===dateKey(new Date(now))){S.cards[id]={...old,last:now};return;}
 const level=Math.min(5,(old.level||0)+1),days=[0,1,3,7,14,30][level];
 S.cards[id]={level,due:now+days*86400000,lastDay:dateKey(new Date(now)),last:now};
}
function activity(points=0){S.xp+=points;const k=dateKey();S.days[k]=(S.days[k]||0)+1;}
function checkAnswer(){if(!quiz||quiz.checked)return;const q=quiz.queue[quiz.at];let value=q.kind==='build'?q.selected.map(i=>q.tokens[i].t).join(' '):quiz.value;
 if(!value.trim()){toast('Спочатку додай відповідь.');return;}
 const right=answerMatches(q,value,q.kind==='choice'||q.kind==='build'?true:quiz.strict);
 quiz.checked=true;quiz.result={right,value,lax:right&&!answerMatches(q,value,true)};
 if(!q.retry){quiz.first++;S.answered++;if(right){quiz.correct++;S.correct++;delete S.errors[q.id];}else{S.errors[q.id]=true;quiz.choicesMissed.push({id:q.id,value});}
 const st=S.stats[q.id]||{seen:0,right:0,last:0};st.seen++;st.right+=right?1:0;st.last=Date.now();S.stats[q.id]=st;
 const points=right?10:0;activity(points);quiz.xp+=points;if(q.card)scoreCard(q.card,right);
 if(!right&&!quiz.test){const repeat=prepare(Q[q.id]);repeat.retry=true;quiz.queue.push(repeat);}
 }else if(right){delete S.errors[q.id];if(q.card)scoreCard(q.card,true);}
 save();render();}
function nextQuestion(){if(!quiz||!quiz.checked)return;quiz.at++;quiz.checked=false;quiz.value='';quiz.result=null;if(quiz.at>=quiz.queue.length){finishQuiz();return;}render();}
function finishQuiz(){const score=Math.round(quiz.correct/quiz.total*100);if(quiz.unit){const old=S.blocks[quiz.unit]||{best:0,runs:0,last:0};S.blocks[quiz.unit]={best:Math.max(old.best,score),runs:old.runs+1,last:Date.now()};}if(quiz.test){S.exams.push({title:quiz.title,score,total:quiz.total,date:Date.now()});S.exams=S.exams.slice(-50);}save();view='result';render();}

 if(checked)body+=`<div class="feedback ${right?'':'bad'}" role="status"><h3>${ico(right?'check':'repeat')}${right?'Так, правильно!':'Запам’ятай цей варіант'}</h3>${!right?`<p class="answer" lang="lt">${E(q.answers[0])}</p>`:''}<p>${E(q.why)}</p>${ans.lax?'<p><b>Зверни увагу на написання:</b> '+E(q.answers[0])+'</p>':''}${!right&&!quiz.test&&!q.retry?'<p>Це завдання повернеться наприкінці.</p>':''}</div>`;
 return `<div class="quiz-top"><button class="circle-btn small" data-action="exit-quiz" aria-label="Завершити тренування">${ico('close')}</button><div class="progress-track" role="progressbar" aria-label="Завдання тренування" aria-valuenow="${quiz.at}" aria-valuemin="0" aria-valuemax="${quiz.queue.length}"><div class="progress-fill" style="width:${quiz.at/quiz.queue.length*100}%"></div></div><span class="count">${quiz.at+1} / ${quiz.queue.length}</span></div><div class="quiz-head"><div class="eyebrow">${quiz.test?'Тест':q.retry?'Повторення помилки':q.kind==='input'?'Напиши відповідь':q.kind==='build'?'Склади речення':'Обери відповідь'} · Урок ${U[q.unit].lesson}</div><h1>${E(q.prompt)}</h1></div>${!q.dialogue?`<div class="quiz-figure">${mascot()}<div class="speech">${q.retry?'Ще одна спроба. Тепер ти знаєш, на що звернути увагу.':q.kind==='build'?'Почни з указаного слова. Щоб повернути слово, торкнися його ще раз.':q.kind==='input'?'Пригадай самостійно. Потрібні литовські літери є під полем.':'Один маленький вибір — ще один крок уперед.'}</div></div>`:''}${body}<div class="quiz-footer">${button(checked?'Продовжити':'Перевірити',checked?'next':'check','primary','','arrow')}<div class="small muted" style="text-align:center;margin-top:10px">${E(quiz.title)}${q.retry?' · повтор без додаткових XP':''}</div></div>`;
}
function screenResult(){const score=Math.round(quiz.correct/quiz.total*100),pass=score>=80;return `<div class="result">${mascot()}<div class="eyebrow muted">${E(quiz.title)}</div><h1 style="margin-top:13px">${pass?'Чудова робота!':'Ще трохи практики!'}</h1><p>${quiz.test?'Результат тесту враховує одну спробу на завдання.':'Точність враховує першу спробу. Повтори допомагають закріпити матеріал.'}</p><div class="result-stats"><div><strong>${score}%</strong><span>точність</span></div><div><strong>+${quiz.xp}</strong><span>XP</span></div><div><strong>${quiz.correct}/${quiz.total}</strong><span>правильно</span></div></div>${quiz.unit?`<p>${pass?'Блок пройдено ✓':'Блок зараховується від 80%.'}</p>`:''}</div>${quiz.choicesMissed.length?`<details><summary>Розбір помилок · ${quiz.choicesMissed.length}</summary>${quiz.choicesMissed.map(x=>{const q=Q[x.id];return `<div class="source-card"><h3>${E(q.prompt)}</h3><p>Твоя відповідь: ${E(x.value)}</p><p><b>Правильно: ${E(q.answers[0])}</b></p><p>${E(q.why)}</p></div>`}).join('')}</details>`:''}<div class="stack gap-top">${quiz.choicesMissed.length?button('Ще раз — складні завдання','retry-session','secondary','','repeat'):''}${button('Повернутися до курсу','go','primary','course','home')}${button('Картки для повторення','go','ghost','cards','cards')}</div>`;}

let voices=[];
function readVoices(){try{voices=window.speechSynthesis?.getVoices()||[];const s=document.getElementById('voice-status');if(s)s.textContent=ltVoice()?'доступний':'не знайдено на цьому пристрої';}catch(e){voices=[];}}
function ltVoice(){return voices.find(v=>/^lt(-|_)?/i.test(v.lang));}
function stopSpeech(){try{window.speechSynthesis?.cancel();}catch(e){}}
function speak(text){readVoices();const voice=ltVoice();if(!voice||!window.SpeechSynthesisUtterance){toast('Литовського голосу немає. Додай голос lt-LT у налаштуваннях пристрою або читай текст.');return;}stopSpeech();const chunks=String(text).match(/[^.!?]+[.!?]*/g)||[String(text)];for(const chunk of chunks){const u=new SpeechSynthesisUtterance(chunk);u.lang='lt-LT';u.voice=voice;u.rate=S.settings.slow?.78:.96;u.onerror=()=>toast('Не вдалося озвучити. Перевір доступність литовського голосу.');window.speechSynthesis.speak(u);}}
function download(name,body,type){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
const icsEscape=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');
function foldIcs(s){const encoder=new TextEncoder();let lines=[],line='';for(const c of s){if(encoder.encode(line+c).length>73){lines.push(line);line=' '+c;}else line+=c;}lines.push(line);return lines.join('\r\n');}
function calendarText(mode,base=new Date()){
 const time=S.reminder.split(':').map(Number),stamp=base.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
 let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Labas//Lesson 9//UK','CALSCALE:GREGORIAN'];
 for(const offset of mode==='daily'?[0]:[1,3,7,14]){
  const d=new Date(base);d.setDate(d.getDate()+offset);d.setHours(time[0],time[1],0,0);if(mode==='daily'&&d<=base)d.setDate(d.getDate()+1);
  const start=dateKey(d).replace(/-/g,'')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
  lines.push('BEGIN:VEVENT','UID:labas9-'+mode+'-'+stamp+'-'+offset+'@local','DTSTAMP:'+stamp,'DTSTART:'+start,'DURATION:PT10M','SUMMARY:'+icsEscape('Литовська: урок 9'),'DESCRIPTION:'+icsEscape('Відкрий index.html. Повтори картки й виконай коротке тренування.'));
  if(mode==='daily')lines.push('RRULE:FREQ=DAILY;COUNT=30');
  lines.push('BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Час для литовської: Labas!'),'END:VALARM','END:VEVENT');
 }
 lines.push('END:VCALENDAR');return lines.map(foldIcs).join('\r\n')+'\r\n';
}

const activities=[['eiti','іти'],['kalbėti','говорити'],['būti','бути'],['žaisti','грати'],['studijuoti','навчатися у виші'],['žiūrėti','дивитися'],['sėdėti','сидіти'],['važiuoti','їхати'],['atostogauti','відпочивати у відпустці']];
function quantityPhrase(id,number,which='acc'){
 const n=D.nouns.find(x=>x.id===id),v=D.numerals.find(x=>x.n===Number(number));
 if(!n||!v)return '';
 return v[(which==='nom'?'n':'a')+n.gender]+' '+n[which==='nom'?(v.n===1?'sg':'pl'):(v.n===1?'acc':'accpl')];
}
function safeBuilder(){
 const b=S.builder,family=D.nouns.filter(x=>x.family),valid=(v,rows,key,fallback)=>rows.some(x=>x[key]===v)?v:fallback;
 const count=v=>String(Math.min(9,Math.max(1,Number(v)||1)));
 return {name:String(b.name||'').slice(0,60),city:valid(b.city,cities,0,'Kaune'),first:valid(b.first,family,'id','brolis'),firstCount:count(b.firstCount),second:valid(b.second,family,'id','sesuo'),secondCount:count(b.secondCount),modal:valid(b.modal,D.verbs,'inf','galėti'),action:valid(b.action,activities,0,'kalbėti')};
}
function ukrainianQuantity(id,num){
 const forms={brolis:['m','брата','братів'],sesuo:['f','сестру','сестер'],sūnus:['m','сина','синів'],duktė:['f','доньку','доньок'],vaikas:['f','дитину','дітей'],pusbrolis:['m','двоюрідного брата','двоюрідних братів'],pusseserė:['f','двоюрідну сестру','двоюрідних сестер'],senelis:['m','дідуся','дідусів'],senelė:['f','бабусю','бабусь'],teta:['f','тітку','тіток'],dėdė:['m','дядька','дядьків'],draugas:['m','друга','друзів'],draugė:['f','подругу','подруг'],anūkas:['m','онука','онуків'],anūkė:['f','онуку','онук']};
 const f=forms[id],n=Number(num);return n===1?(f[0]==='m'?'одного ':'одну ')+f[1]:['','','двох','трьох','чотирьох','п’ятьох','шістьох','сімох','вісьмох','дев’ятьох'][n]+' '+f[2];
}
function builderLines(){
 const b=safeBuilder(),v=D.verbs.find(x=>x.inf===b.modal),a=activities.find(x=>x[0]===b.action),city={Kaune:'Каунасі',Vilniuje:'Вільнюсі',Palangoje:'Паланзі',Londone:'Лондоні',Berlyne:'Берліні'}[b.city];
 return [
 ['Mano vardas '+(b.name.trim()||'…')+'.','Мене звати '+(b.name.trim()||'…')+'.'],
 ['Aš gyvenu '+b.city+'.','Я живу в '+city+'.'],
 ['Aš turiu '+quantityPhrase(b.first,b.firstCount)+'.','Я маю '+ukrainianQuantity(b.first,b.firstCount)+'.'],
 ['Aš turiu '+quantityPhrase(b.second,b.secondCount)+'.','Я маю '+ukrainianQuantity(b.second,b.secondCount)+'.'],
 ['Aš '+v.forms[0]+' '+a[0]+'.','Я '+v.translations[0]+' '+a[1]+'.']
 ];
}

 '<details open><summary>Як користуватися на телефоні</summary><p>Завантаж index.html та відкрий його у браузері. Пояснення, вправи, словник і тексти містяться всередині файла та працюють без інтернету. Якщо переглядач файлів не запускає вправи, обери «Відкрити у браузері».</p><p>Прогрес зберігається у цьому браузері. Для іншого телефона або перед очищенням даних зроби JSON-копію у профілі.</p></details>'+
